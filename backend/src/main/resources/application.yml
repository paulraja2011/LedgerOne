server:
  port: 8080

spring:
  application:
    name: ledgerone
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgerone}
    username: ${DB_USER:ledgerone}
    password: ${DB_PASSWORD:ledgerone}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true

ledgerone:
  jwt:
    # 32+ byte secret for HS256. Override with JWT_SECRET in every real environment.
    secret: ${JWT_SECRET:change-me-dev-only-secret-0123456789abcdef}
    ttl-minutes: 480
  seed-demo-data: ${SEED_DEMO_DATA:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
