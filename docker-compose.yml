# Local PostgreSQL for LedgerOne (alternative to a locally installed Postgres).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ledgerone
      POSTGRES_USER: ledgerone
      POSTGRES_PASSWORD: ledgerone
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
